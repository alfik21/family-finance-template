      <stop offset="0.45" stop-color="#1b4332"/>
      <stop offset="1" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="230" fill="#40916c" opacity="0.18"/>
  <circle cx="1090" cy="590" r="170" fill="#74c69d" opacity="0.12"/>
  <circle cx="60" cy="610" r="150" fill="#ffffff" opacity="0.05"/>

  <!-- Brand -->
